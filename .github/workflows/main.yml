name: Build EXE

on:
  workflow_dispatch: # para correres quando quiseres clicando num botão

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE com PyInstaller
      run: |
        pyinstaller standalone.spec --clean
        # se o spec falhar, descomenta a linha de baixo:
        # pyinstaller --onefile --name zoffline --add-data "cdn;cdn" --add-data "data;data" --add-data "ssl;ssl" --add-data "storage;storage" standalone.py
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: zoffline-exe
        path: dist/
